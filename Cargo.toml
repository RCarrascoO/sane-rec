[package]
name = "sane-rec"
version = "0.1.0"
edition = "2021"
authors = ["RCarrascoO"]
description = "Lightweight Material Design 3 Instant Replay & Screen Recorder for Linux with CPU-first architecture"
license = "MIT OR Apache-2.0"
build = "build.rs"

[dependencies]
slint = "1.8"
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
gstreamer-audio = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
notify-rust = "4.11"
directories = "5.0"
chrono = "0.4"
libc = "0.2"

[build-dependencies]
slint-build = "1.8"
