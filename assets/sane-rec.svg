<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e182e"/>
      <stop offset="100%" stop-color="#120f1d"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0bcff"/>
      <stop offset="50%" stop-color="#9a82db"/>
      <stop offset="100%" stop-color="#6750a4"/>
    </linearGradient>
    <linearGradient id="record-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5449"/>
      <stop offset="100%" stop-color="#b3261e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" stroke="#38324a" stroke-width="4"/>

  <!-- Outer Replay Orbit / Buffer Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring-grad)" stroke-width="24" stroke-linecap="round" stroke-dasharray="720 280" transform="rotate(-45 256 256)" filter="url(#glow)"/>

  <!-- Inner Replay Arrow indicating Instant Replay Rewind -->
  <path d="M 256 120 L 296 90 L 296 150 Z" fill="#d0bcff"/>

  <!-- Center recording core -->
  <circle cx="256" cy="256" r="82" fill="url(#record-grad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="68" fill="#ffffff" opacity="0.95"/>
  <circle cx="256" cy="256" r="44" fill="#b3261e"/>
</svg>
